  const swiper = new Swiper('.swiper-projects', {
    centeredSlides: true,
    slidesPerView: 1,
    effect: 'fade',
    fadeEffect: {
      crossFade: true
    },
    speed: 0,
    loop: true, // Enable loop for mobile and desktop
    createElements: true,
    initialSlide: 0, // Ensure the first slide is the one with aria-label 1/8
    navigation: {
      nextEl: '.swiper-button-next.swiper-arrow',
      prevEl: '.swiper-button-prev.swiper-arrow',
    },
    keyboard: {
      enabled: true,
    },
    pagination: false,
    autoplay: false,
    allowTouchMove: false,
    breakpoints: {
      1024: {
        loop: true,  // Enable loop on desktop
      },
      768: {
        loop: true,  // Ensure loop is enabled on mobile as well
      }
    },
    on: {
      init: function () {
        // Ensure the first slide loads correctly with opacity 1 on both mobile and desktop
        this.slides.forEach(slide => {
          slide.style.opacity = 0; // Set opacity to 0 for all slides initially
        });
        const firstSlide = this.slides[1]; // The first real slide (after loop clone)
        firstSlide.style.opacity = 1; // Set opacity of the first slide to 1
      },
      slideChangeTransitionStart: function () {
        resetSlides(); // Reset opacity and loaded state when slide changes
        const activeImageLink = document.querySelector(".swiper-slide-active .swiper-image-link");
        if (activeImageLink) {
          handleImageLoad(activeImageLink); // Handle the active slide's image
        }
      }
    }
  });
  // Add click event to each slide
  document.querySelectorAll(".swiper-project-image-nav-next").forEach((slide) => {
    slide.addEventListener("click", () => {
      swiper.slideNext(); // Advance to the next slide
    });
  });
  document.querySelectorAll(".swiper-project-image-nav-prev").forEach((slide) => {
    slide.addEventListener("click", () => {
      swiper.slidePrev(); // Advance to the previous slide
    });
  });
</script>
    <!--  Swiper - Reset Slide States  -->
    <script>
  function resetSlides() {
    // Reset the .loaded class and opacity for all slides except the active one
    document.querySelectorAll('.swiper-image-link').forEach(link => {
      link.classList.remove('loaded'); // Remove the .loaded class
    });
    // Reset opacity of all slides
    document.querySelectorAll('.swiper-slide').forEach(slide => {
      slide.style.opacity = '0'; // Set opacity to 0 for all slides
    });
    // Ensure active slide opacity is 1
    const activeSlide = document.querySelector('.swiper-slide-active');
    if (activeSlide) {
      activeSlide.style.opacity = '1'; // Set opacity of the active slide to 1
    }
  }
</script>
    <!--  Swiper - Pixelated Lazy Load Image Ref  -->
    <script>
  function applyBlurEffect() {
    // Get reference elements (blurred images)
    const refElements = document.querySelectorAll(".swiper-image-link-ref");
    console.log("Reference Elements Found:", refElements.length);
    // Get all parent slides
    const parentSlides = document.querySelectorAll(".swiper-slide");
    console.log("Parent Slides Found:", parentSlides.length);
    // Map the background images to the correct slides
    parentSlides.forEach((slide) => {
      // Get the aria-label value (e.g., "1 / 8")
      const ariaLabel = slide.getAttribute("aria-label");
      if (!ariaLabel) return;
      // Extract the numeric index from aria-label (e.g., "1 / 8" → 1)
      const slideIndex = parseInt(ariaLabel.split(" / ")[0], 10) - 1;
      // Ensure the slideIndex is valid and matches a reference element
      if (slideIndex >= 0 && slideIndex < refElements.length) {
        const refElement = refElements[slideIndex];
        const targetElement = slide.querySelector(".swiper-image-link");
        if (refElement && targetElement) {
          // Get the background image from the reference element
          const backgroundImage = window.getComputedStyle(refElement).backgroundImage;
          if (backgroundImage && backgroundImage !== "none") {
            targetElement.style.backgroundImage = backgroundImage;
            console.log(`Applied Background Image to Slide ${ariaLabel} (Index ${slideIndex})`);
          } else {
            console.warn(`No background image found for Reference Element at Index ${slideIndex}`);
          }
        }
      } else {
        console.warn(`Invalid Slide Index for Slide ${ariaLabel}`);
      }
    });
  }
  // Start the blur effect application process
  applyBlurEffect();
</script>
    <!--  Blurred Image Load with Swiper Navigation  -->
    <script>
  const blurDivs = document.querySelectorAll(".swiper-image-link");
  // Function to handle image load and add the .loaded class
  function handleImageLoad(div) {
    const img = div.querySelector("img");
    function loaded() {
      setTimeout(() => {
        div.classList.add("loaded"); // Add the .loaded class after 350ms
      }, 350);
    }
    // Show the blurred background immediately
    if (img.complete) {
      loaded(); // If the image is already loaded
    } else {
      img.addEventListener("load", loaded); // Wait for the image to load
    }
  }
  // Attach the logic to each image div
  blurDivs.forEach((div) => {
    handleImageLoad(div);
  });
</script>
    <!--  Mouse Hover Slide Number Effect  -->
    <script>
  // Function to check if the device is desktop or mobile
  function isDesktop() {
    return window.innerWidth >= 1024; // Adjust the width threshold as needed
  }
  // Select the Swiper slides and custom cursor container
  const slides = document.querySelectorAll(".swiper-image-link");
  const cursor = document.querySelector(".custom-cursor");
  // Function to update cursor position
  function updateCursorPosition(event) {
    const { clientX, clientY } = event;
    cursor.style.left = `${clientX + 10}px`; // Offset by 10px for better visibility
    cursor.style.top = `${clientY + 10}px`;
  }
  // Function to update cursor text
  function updateCursorText(slide) {
    const parentSlide = slide.closest(".swiper-slide"); // Get the parent .swiper-slide
    const ariaLabel = parentSlide.getAttribute("aria-label"); // Get the aria-label
    cursor.textContent = ariaLabel; // Set the cursor text
  }
  // Check if we are on a desktop device
  if (isDesktop()) {
    // Add hover and mouse movement events to slides
    slides.forEach((slide) => {
      // Show custom cursor with aria-label on hover
      slide.addEventListener("mouseenter", (event) => {
        updateCursorText(slide); // Update the text based on the hovered slide
        cursor.style.opacity = 1; // Make cursor visible
      });
      // Hide custom cursor when hover ends
      slide.addEventListener("mouseleave", () => {
        cursor.style.opacity = 0; // Hide the cursor
      });
      // Update cursor position as the mouse moves
      slide.addEventListener("mousemove", updateCursorPosition);
    });
    // Ensure the cursor follows the mouse on the whole page
    document.addEventListener("mousemove", updateCursorPosition);
    // Synchronize cursor text with Swiper's active slide
    swiper.on("slideChangeTransitionStart", () => {
      const activeSlide = document.querySelector(".swiper-slide-active .swiper-image-link");
      if (activeSlide) {
        updateCursorText(activeSlide);
      }
    });
    // Handle click event to update cursor text immediately
    slides.forEach((slide) => {
      slide.addEventListener("click", () => {
        const activeSlide = document.querySelector(".swiper-slide-active .swiper-image-link");
        if (activeSlide) {
          updateCursorText(activeSlide);
        }
      });
    });
  } else {
    // Optionally hide the cursor on mobile
    cursor.style.display = "none"; // Hides the custom cursor if on mobile
  }
</script>
