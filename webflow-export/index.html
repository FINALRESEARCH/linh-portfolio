    <script>
  document.addEventListener("DOMContentLoaded", () => {
    const progressBar = document.querySelector(".swiper-progress-bar-fill");
    if (!progressBar) {
      console.error("Progress bar element not found.");
      return;
    }
    // Function to reset and start the progress bar animation
    function updateProgressBar() {
      progressBar.style.transition = "none";
      progressBar.style.width = "0%"; // Reset the progress bar to 0%
      // Force a reflow to ensure that the browser processes the reset
      progressBar.offsetHeight; // Accessing this property forces reflow (recalculates layout)
      // Start the animation with a small delay to allow reflow
      setTimeout(() => {
        progressBar.style.transition = "width 5000ms linear"; // 5 seconds duration
        progressBar.style.width = "100%";
      }, 10); // Small delay for DOM reflow
    }
    // Initialize Swiper
    const swiper = new Swiper(".swiper-projects", {
      centeredSlides: true,
      slidesPerView: 1,
      effect: "fade",
      fadeEffect: {
        crossFade: true,
      },
      speed: 0,
      loop: false, // Disable loop in Swiper, we'll handle looping manually
      createElements: true,
      navigation: {
        nextEl: ".swiper-button-next.swiper-arrow",
        prevEl: ".swiper-button-prev.swiper-arrow",
      },
      keyboard: {
        enabled: true,
      },
      pagination: false,
      allowTouchMove: false,
    });
    // Function to handle image load and add the .loaded class only for the active slide
    function handleImageLoad() {
      const allImageLinks = document.querySelectorAll(".swiper-image-link");
      allImageLinks.forEach((link) => {
        link.classList.remove("loaded");
      });
      const activeSlide = document.querySelector(".swiper-slide-active .swiper-image-link");
      if (activeSlide) {
        const img = activeSlide.querySelector("img");
        function loaded() {
          setTimeout(() => {
            activeSlide.classList.add("loaded"); // Add the .loaded class after a small delay
          }, 350); // Delay for adding the .loaded class
        }
        activeSlide.classList.remove("loaded");
        if (img.complete) {
          loaded();
        } else {
          img.addEventListener("load", loaded);
        }
      }
    }
    // Start the progress bar and trigger the first image load immediately after initialization
    updateProgressBar();
    handleImageLoad();
    let currentSlideIndex = 0;
    const totalSlides = document.querySelectorAll(".swiper-slide").length; // Total number of slides
    // Function to manually trigger the next slide and update progress bar
    function goToNextSlide() {
      currentSlideIndex = (currentSlideIndex + 1) % totalSlides; // Move to next slide, loop to first if at the last
      swiper.slideTo(currentSlideIndex); // Go to the slide at currentSlideIndex
      updateProgressBar(); // Reset and start progress bar animation
      handleImageLoad(); // Handle image loading for the new active slide
    }
    // Function to manually trigger the previous slide and update progress bar
    function goToPrevSlide() {
      currentSlideIndex = (currentSlideIndex - 1 + totalSlides) % totalSlides; // Move to previous slide, loop to last if at the first
      swiper.slideTo(currentSlideIndex); // Go to the slide at currentSlideIndex
      updateProgressBar(); // Reset and start progress bar animation
      handleImageLoad(); // Handle image loading for the new active slide
    }
    // Start the autoplay initially (move to next slide every 8 seconds)
    let autoplayInterval;
    function startAutoplay() {
      autoplayInterval = setInterval(() => {
        goToNextSlide(); // Go to the next slide
      }, 5000); // 5 seconds interval
    }
    // Start autoplay
    startAutoplay();
    // Add click event to each slide navigation button (Next)
    document.querySelectorAll(".swiper-button-next.swiper-arrow").forEach((button) => {
      button.addEventListener("click", () => {
        goToNextSlide(); // Go to the next slide
        clearInterval(autoplayInterval); // Stop autoplay
        startAutoplay(); // Restart autoplay
      });
    });
    // Add click event to each slide navigation button (Prev)
    document.querySelectorAll(".swiper-button-prev.swiper-arrow").forEach((button) => {
      button.addEventListener("click", () => {
        goToPrevSlide(); // Go to the previous slide
        clearInterval(autoplayInterval); // Stop autoplay
        startAutoplay(); // Restart autoplay
      });
    });
    // Ensure the progress bar resets after a delay when using autoplay
    swiper.on('slideChange', () => {
      updateProgressBar(); // Reset and start progress bar animation every time the slide changes
      handleImageLoad(); // Handle image loading for the new active slide
    });
  });
</script>
